services:
  - type: web
    name: chronicle-blog-platform
    env: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: ADMIN_EMAIL
        value: admin@chronicle.com
      - key: ADMIN_PASSWORD
        sync: false
